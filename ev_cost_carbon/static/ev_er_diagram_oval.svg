      .relationship { fill: #fff2cc; stroke: #b8860b; stroke-width: 3; }
      .attribute { fill: #f8fbff; stroke: #4f87c2; stroke-width: 2.5; }
      .keyAttr { fill: #eef9ec; stroke: #2f8f46; stroke-width: 3; }
      .line { stroke: #597ea6; stroke-width: 2.5; }
      .dashed { stroke-dasharray: 8 6; }
    </style>
