<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #183153; }
      .entityText { font: 700 20px Arial, sans-serif; fill: #10243e; }
      .attrText { font: 16px Arial, sans-serif; fill: #17324d; }
      .relText { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .smallText { font: 14px Arial, sans-serif; fill: #35506b; }
